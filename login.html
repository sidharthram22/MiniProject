{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - NPTEL LITE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'style.css' %}" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <span class="brand-badge">NPTEL LITE</span>
        <h1 style="margin-top: 10px;">Sign In</h1>
        <p style="color: var(--muted); font-size: 0.9rem;">AI-Powered Mock Test Platform for NPTEL Learners & Admins</p>
      </div>

      {% if error %}
      <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 0.88rem;">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      <form action="{% url 'login' %}" method="POST" id="login-form">
        {% csrf_token %}
        <div class="form-group">
          <label for="email">NPTEL Email / ID</label>
          <input type="email" id="email" name="email" placeholder="e.g. aisha@nptel.ac.in" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In to Dashboard</button>
      </form>

      <div style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 18px;">
        <p style="font-size: 0.82rem; color: var(--muted); margin-bottom: 10px; font-weight: 600;">⚡ Quick Demo Auto-Login:</p>
        <div class="demo-students-grid">
          {% for student in demo_students %}
          <button type="button" class="demo-user-btn" onclick="quickLogin('{{ student.email }}', '{{ student.password }}')">
            <span><strong>{{ student.name }}</strong> <small>({{ student.role }})</small></span>
            <span class="role-pill {{ student.role }}">Login →</span>
          </button>
          {% endfor %}
        </div>
      </div>

      <div style="margin-top: 20px; text-align: center; font-size: 0.9rem; color: var(--muted);">
        <p>New Student? <a href="{% url 'register' %}" style="color: var(--accent); font-weight: 600; text-decoration: none;">Create an Account</a></p>
      </div>
    </div>
  </div>

  <script>
    function quickLogin(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('login-form').submit();
    }
  </script>
</body>
</html>
